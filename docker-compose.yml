services:
  postgresql:
    image: postgres:13
    environment:
      POSTGRES_PASSWORD: temporal
      POSTGRES_USER: temporal
      POSTGRES_DB: temporal
    ports:
      - "5432:5432"

  temporal:
    image: temporalio/auto-setup:1.22
    depends_on:
      - postgresql
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
    ports:
      - "7233:7233"

  temporal-ui:
    image: temporalio/ui:2.25.0
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
    ports:
      - "8233:8080"

  # Local application services for convenience
  app-worker:
    build: .
    image: realtime-agent:local
    depends_on:
      - temporal
    environment:
      - ROLE=worker
      - TEMPORAL_ADDRESS=temporal:7233

  app-streamer:
    build: .
    image: realtime-agent:local
    depends_on:
      - temporal
    environment:
      - ROLE=streamer
      - TEMPORAL_ADDRESS=temporal:7233
    volumes:
      - ./temporal_app/app.log:/app/temporal_app/app.log:rw
    tty: true

  app-api:
    build: .
    image: realtime-agent:local
    depends_on:
      - temporal
    environment:
      - ROLE=api
      - TEMPORAL_ADDRESS=temporal:7233
      - PORT=8000
    ports:
      - "8000:8000"
